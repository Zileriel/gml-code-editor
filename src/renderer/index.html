<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net">
    <title>GM Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/lib/codemirror.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/theme/monokai.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/theme/ambiance.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/theme/dracula.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/fold/foldgutter.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/hint/show-hint.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/lint/lint.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <div id="inspector" class="panel">
            <div class="panel-header">Inspector</div>
            <div class="panel-content">
                <!-- Inspector content will go here -->
            </div>
        </div>
        
        <div id="inspector-divider" class="divider"></div>
        
        <div id="editor" class="panel">
            <div class="panel-header">Editor</div>
            <div class="panel-content">
                <textarea id="code-editor"></textarea>
            </div>
        </div>
        
        <div id="editor-divider" class="divider"></div>
        
        <div id="asset-browser" class="panel">
            <div class="panel-header">Explorer</div>
            <div class="panel-content">
                <div id="asset-tree">
                    <div id="scripts-root" class="tree-root">
                        <div class="tree-header">
                            <i class="bi bi-code-square"></i> Scripts
                        </div>
                        <div class="tree-content"></div>
                    </div>
                    <div id="objects-root" class="tree-root">
                        <div class="tree-header">
                            <i class="bi bi-box"></i> Objects
                        </div>
                        <div class="tree-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Core CodeMirror -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/mode/javascript/javascript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/mode/xml/xml.js"></script>
    
    <!-- Auto brackets and matching -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/edit/matchbrackets.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/edit/closebrackets.js"></script>
    
    <!-- Code folding -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/fold/foldcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/fold/foldgutter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/fold/brace-fold.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/fold/comment-fold.js"></script>
    
    <!-- Comments -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/comment/comment.js"></script>

    <!-- Autocompletion -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/hint/show-hint.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/hint/javascript-hint.js"></script>
    
    <!-- Search & Replace -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/search/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/search/searchcursor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/search/jump-to-line.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/dialog/dialog.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/dialog/dialog.css" rel="stylesheet">
    
    <!-- Linting -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/lint/lint.js"></script>
    
    <!-- Our app code -->
    <script src="scripts/renderer.js"></script>
</body>
</html>
