<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net">
    <title>GM Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <div id="inspector" class="panel">
            <div class="panel-header">Inspector</div>
            <div class="panel-content">
                <!-- Inspector content will go here -->
            </div>
        </div>
        
        <div id="inspector-divider" class="divider"></div>
        
        <div id="editor" class="panel">
            <div class="panel-header">Editor</div>
            <div class="panel-content">
                <!-- Editor content will go here -->
            </div>
        </div>
        
        <div id="editor-divider" class="divider"></div>
        
        <div id="asset-browser" class="panel">
            <div class="panel-header">Asset Browser</div>
            <div class="panel-content">
                <div id="asset-tree">
                    <div id="scripts-root" class="tree-root">
                        <div class="tree-header">
                            <i class="bi bi-code-square"></i> Scripts
                        </div>
                        <div class="tree-content"></div>
                    </div>
                    <div id="objects-root" class="tree-root">
                        <div class="tree-header">
                            <i class="bi bi-box"></i> Objects
                        </div>
                        <div class="tree-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/renderer.js"></script>
</body>
</html>
